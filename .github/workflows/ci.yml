name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: typecheck + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Validate setup scripts
        run: |
          bash -n setup.sh
          bash -n setup-local.sh
          bash -n start-local.sh
          bash -n scripts/docker-entrypoint.sh
          test -x setup.sh
          test -x setup-local.sh
          test -x start-local.sh

      - name: Test
        run: npm test
        env:
          # Placeholders only. Do not inject repository secrets into the test process.
          OPENROUTER_API_KEY: test-openrouter-key
          GOOGLE_AI_STUDIO_API_KEY: test-googleai-key
          MINIMAX_API_KEY: test-minimax-key

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies for critical advisories
        run: npm audit --audit-level=critical
